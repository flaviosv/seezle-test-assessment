services:
  backend:
    build: ./backend
    ports:
      - "8090:8090"
    environment:
      - API_PORT=8090
      - APP_ENV=production
      - GIN_MODE=release
      - LOG_LEVEL=info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8090
    ports:
      - "8080:8080"
    depends_on:
      - backend
